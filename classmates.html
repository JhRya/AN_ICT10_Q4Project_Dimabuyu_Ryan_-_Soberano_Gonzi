<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classmates 📗</title>
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f9f7f2;
            color: #2d3436;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .top-nav {
            width: 100%;
            max-width: 1100px;
            margin-bottom: 20px;
            text-align: left;
        }

        .back-link {
            text-decoration: none;
            color: #9b111e;
            font-weight: 700;
            font-size: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            background: #fff;
            padding: 10px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            border: 1px solid #f1f1e9;
        }

        .back-link:hover {
            background-color: #9b111e;
            color: #ffffff;
            transform: translateX(-5px);
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background: #ffffff;
            padding: 40px;
            border-radius: 30px; 
            box-shadow: 0 20px 40px rgba(155, 17, 30, 0.06);
            text-align: center;
            box-sizing: border-box;
            border-top: 8px solid #9b111e;
        }

        header {
            margin-bottom: 35px;
        }

        h1 {
            color: #9b111e;
            font-size: 26px;
            margin: 0;
            font-weight: 800;
        }

        header p {
            color: #636e72;
            font-weight: 700;
            margin: 5px 0 0 0;
            font-size: 13px;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            margin-bottom: 12px;
            border: 2px solid #f1f1e9;
            background-color: #fffefb;
            border-radius: 18px;
            outline: none;
            font-size: 15px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #9b111e;
            background-color: #ffffff;
            box-shadow: 0 4px 12px rgba(155, 17, 30, 0.05);
        }

        .btns {
            display: flex;
            gap: 12px;
            margin: 20px 0;
        }

        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 18px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #add-btn {
            background-color: #9b111e;
            color: white;
        }

        #add-btn:hover {
            background-color: #7d0e18;
            transform: scale(1.02);
        }

        #show-btn {
            background-color: #f9f7f2;
            color: #9b111e;
            border: 1px solid #f1f1e9;
        }

        #show-btn:hover {
            background-color: #f1f1e9;
            transform: scale(1.02);
        }

        #display-area {
            display: none;
            margin-top: 30px;
            text-align: left;
        }

        .intro-text {
            background: #ffffff;
            border: 1px solid #f1f3f5;
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 20px;
            font-size: 14px;
            line-height: 1.6;
            border-left: 6px solid #9b111e;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html" class="back-link">
            <span>←</span> Back to Portal
        </a>
    </div>

    <div class="container">
        <header>
            <h1>CLASSMATE DIRECTORY</h1>
            <p>A.Y. 2025-2026</p>
        </header>

        <input type="text" id="name" placeholder="Name">
        <input type="text" id="section" placeholder="Section">
        <input type="text" id="subject" placeholder="Favorite Subject">

        <div class="btns">
            <button id="add-btn" py-click="add_classmate">Add Entry</button>
            <button id="show-btn" py-click="toggle_list">Show List</button>
        </div>

        <div id="display-area">
            <div id="output-list"></div>
        </div>
    </div>

    <script type="py" src="main.py"></script>
</body>
</html>
